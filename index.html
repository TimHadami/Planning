<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Planning">
<meta name="theme-color" content="#F4F6FC">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%235B51F7'/><rect x='20' y='26' width='80' height='10' rx='5' fill='white' opacity='.95'/><rect x='20' y='44' width='58' height='8' rx='4' fill='white' opacity='.7'/><rect x='20' y='60' width='68' height='8' rx='4' fill='white' opacity='.7'/><rect x='20' y='76' width='48' height='8' rx='4' fill='white' opacity='.7'/><rect x='20' y='92' width='36' height='8' rx='4' fill='white' opacity='.5'/></svg>">
<title>Mon Planning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
:root{
  --bg:#F4F6FC;--bg2:#FFFFFF;--bg3:#F0F2FA;--bg4:#E6E9F6;--bg5:#D6DBF0;
  --t1:#0F1729;--t2:#5C6A8A;--t3:#96A0BC;
  --bdr:rgba(15,23,41,.08);--bdr2:rgba(15,23,41,.14);
  --acc:#5B51F7;--acc2:rgba(91,81,247,.1);--acc3:rgba(91,81,247,.06);
  --cab:#1E6FB5;--per:#0E7A5F;--ia:#5B51F7;
  --spt:#C47D0A;--rut:#6B7280;--lec:#B04A26;--soc:#B03668;
  --q1:#CC3B3B;--q2:#0E7A5F;--q3:#C47D0A;--q4:#6B7280;
  --sh:0 1px 4px rgba(15,23,41,.07),0 4px 16px rgba(15,23,41,.06);
  --sh2:0 8px 40px rgba(15,23,41,.14);
  --r:16px;--r2:12px;--r3:10px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t);overflow:hidden}

/* HEADER */
.hdr{padding:16px 20px 4px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between}
.hdr-left .h1{font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--t1)}
.hdr-left .h2{font-size:13px;color:var(--t2);margin-top:2px;font-weight:400}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--bdr);
  color:var(--t2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0}

/* DAY SELECTOR */
.ds-wrap{display:flex;gap:6px;padding:8px 20px 12px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ds-wrap::-webkit-scrollbar{display:none}
.dp{min-width:46px;height:62px;border-radius:14px;background:var(--bg3);
  border:1.5px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;cursor:pointer;flex-shrink:0;transition:.15s}
.dp.today{border-color:var(--acc)}
.dp.active{background:var(--acc);border-color:transparent}
.dp .dn{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.dp .dd{font-size:18px;font-weight:700;color:var(--t1);margin-top:1px}
.dp .dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:3px}
.dp.has-t .dot{background:var(--acc)}
.dp.active .dn,.dp.active .dd{color:#fff}
.dp.active .dot{background:rgba(255,255,255,.55)}
.dp.today:not(.active) .dn,.dp.today:not(.active) .dd{color:var(--acc)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:0 16px 100px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* TASK CARD */
.tlist{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.tc{background:var(--bg2);border-radius:var(--r);padding:14px 15px;border-left:4px solid;
  cursor:pointer;transition:.12s;box-shadow:var(--sh)}
.tc:active{transform:scale(.975);box-shadow:none}
.tc-t{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:3px;line-height:1.35}
.tc-time{font-size:12px;color:var(--t2);font-weight:500}
.tc-meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.rbadge{font-size:11px;color:var(--t2);font-weight:500}
.mbadge{font-size:11px;font-weight:600}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty .ei{font-size:42px;margin-bottom:14px}
.empty p{font-size:15px;line-height:1.6;color:var(--t2)}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--bdr);padding-bottom:var(--safe-b);z-index:90}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0;cursor:pointer;color:var(--t3);gap:3px;border:none;background:none;font-family:inherit;transition:.15s}
.ni.active{color:var(--acc)}
.ni-ico{font-size:21px;line-height:1}
.ni-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* FAB */
.fab{position:fixed;right:20px;width:54px;height:54px;border-radius:50%;
  background:var(--acc);border:none;color:#fff;font-size:26px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(91,81,247,.4),0 1px 4px rgba(91,81,247,.2);z-index:91;transition:.15s}
.fab:active{transform:scale(.88);box-shadow:0 2px 8px rgba(91,81,247,.35)}

/* OVERLAY + SHEET */
.ovl{position:fixed;inset:0;background:rgba(15,23,41,.4);z-index:200;opacity:0;
  pointer-events:none;transition:.22s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ovl.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:22px 22px 0 0;
  z-index:201;transform:translateY(102%);transition:.32s cubic-bezier(.32,0,.16,1);
  max-height:93vh;overflow-y:auto;padding-bottom:calc(var(--safe-b)+10px);scrollbar-width:none;
  box-shadow:0 -8px 40px rgba(15,23,41,.12)}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.sh-hdl{width:36px;height:4px;border-radius:2px;background:var(--bg4);margin:12px auto 0;display:block}
.sh-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.sh-tit{font-size:18px;font-weight:700;color:var(--t1)}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--bdr);
  color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sh-body{padding:4px 20px 12px}

/* FORM ELEMENTS */
.fg{margin-bottom:15px}
.fl{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:7px;display:block;
  text-transform:uppercase;letter-spacing:.7px}
.fi{width:100%;background:var(--bg3);border:1.5px solid var(--bdr2);border-radius:var(--r2);
  padding:13px 15px;font-size:16px;color:var(--t1);outline:none;-webkit-appearance:none;
  font-family:inherit;-webkit-user-select:auto;user-select:auto;transition:.15s}
.fi:focus{border-color:var(--acc);background:var(--bg2)}
input[type=time].fi{color-scheme:light}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-lbl{font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:600}

/* GRIDS */
.cat-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-btn{padding:9px 4px;border-radius:var(--r3);border:2px solid transparent;background:var(--bg3);
  font-size:10px;font-weight:700;cursor:pointer;text-align:center;transition:.12s;
  text-transform:uppercase;letter-spacing:.3px;line-height:1.3;font-family:inherit;color:var(--t2)}
.cat-btn.on{border-color:currentColor}
.day-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day-btn{padding:10px 4px;border-radius:var(--r3);border:1.5px solid var(--bdr2);background:var(--bg3);
  font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:var(--t2);font-family:inherit;transition:.12s}
.day-btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.rem-row{display:flex;gap:7px;flex-wrap:wrap}
.rem-btn{padding:8px 13px;border-radius:20px;border:1.5px solid var(--bdr2);background:var(--bg3);
  font-size:13px;color:var(--t2);cursor:pointer;font-family:inherit;transition:.12s}
.rem-btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.q-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-btn{padding:11px 8px;border-radius:var(--r2);border:2px solid var(--bdr2);cursor:pointer;
  text-align:center;background:var(--bg3);font-family:inherit;transition:.12s}
.q-btn .ql{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.q-btn .qs{font-size:10px;margin-top:2px;opacity:.72}
.q-btn.on{border-width:2px}
.days-g{display:flex;gap:6px;flex-wrap:wrap}
.days-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bdr2);background:var(--bg3);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);display:flex;align-items:center;justify-content:center;transition:.12s}
.days-btn.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}

/* BUTTONS */
.btn-p{width:100%;padding:15px;border-radius:var(--r2);background:var(--acc);color:#fff;
  font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:8px;font-family:inherit;
  box-shadow:0 4px 14px rgba(91,81,247,.25);transition:.15s}
.btn-p:active{opacity:.85;transform:scale(.98)}
.btn-d{width:100%;padding:14px;border-radius:var(--r2);background:rgba(204,59,59,.08);color:var(--q1);
  font-size:15px;font-weight:700;border:1px solid rgba(204,59,59,.22);cursor:pointer;margin-top:10px;font-family:inherit}
.btn-s{width:100%;padding:14px;border-radius:var(--r2);background:var(--bg3);color:var(--t2);
  font-size:15px;font-weight:600;border:1.5px solid var(--bdr2);cursor:pointer;margin-top:10px;font-family:inherit}
.divl{height:1px;background:var(--bdr);margin:14px 0}
.info-row{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg3);
  border-radius:var(--r3);margin-bottom:2px;border:1px solid var(--bdr)}
.info-row span{font-size:13px;color:var(--t2);flex:1;line-height:1.45}

/* EISENHOWER */
.mat-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:100px}
.mat-wrap::-webkit-scrollbar{display:none}
.mat-g{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px 14px 4px}
.quad{border-radius:var(--r);padding:13px 12px;background:var(--bg2);
  box-shadow:var(--sh);border-top:3px solid;display:flex;flex-direction:column;gap:7px;min-height:160px}
.q-hd{margin-bottom:2px}
.q-nm{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.q-lbl{font-size:12px;font-weight:600;margin-top:1px;line-height:1.3;color:var(--t1)}
.q-hint{font-size:10px;color:var(--t2);margin-top:1px}
.qt{background:var(--bg3);border-radius:9px;padding:9px 10px;font-size:13px;
  font-weight:500;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;
  gap:5px;transition:.12s;line-height:1.35;border:1px solid var(--bdr)}
.qt:active{transform:scale(.96)}
.qt-tx{flex:1;color:var(--t1)}
.qt-ic{font-size:11px;flex-shrink:0;color:var(--t3);display:flex;gap:3px}
.q-add{background:var(--bg3);border-radius:9px;padding:8px 10px;font-size:12px;
  color:var(--t3);cursor:pointer;display:flex;align-items:center;gap:5px;
  border:1.5px dashed var(--bdr2);margin-top:2px;font-weight:500}

/* BRAIN HACKING */
.brain-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:100px}
.brain-wrap::-webkit-scrollbar{display:none}
.brain-content{padding:0 16px 8px}
.section-hdr{font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:.7px;padding:16px 0 8px;display:flex;align-items:center;gap:8px}
.hk-card{background:var(--bg2);border-radius:var(--r);margin-bottom:8px;
  box-shadow:var(--sh);overflow:hidden;border:1px solid var(--bdr);cursor:pointer}
.hk-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.hk-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0}
.hk-info{flex:1}
.hk-title{font-size:14px;font-weight:600;color:var(--t1);line-height:1.3}
.hk-ctx{font-size:11px;color:var(--t3);margin-top:2px}
.hk-arr{font-size:18px;color:var(--t3);flex-shrink:0;transition:.2s;line-height:1}
.hk-body{padding:0 16px 14px;display:none}
.hk-body.open{display:block}
.hk-desc{font-size:13px;color:var(--t2);line-height:1.65}
.hk-tag{display:inline-block;font-size:10px;font-weight:700;padding:4px 10px;
  border-radius:20px;margin-top:10px;text-transform:uppercase;letter-spacing:.4px}
.diag-card{border-radius:var(--r);padding:14px 16px;margin-bottom:8px;border-left:4px solid}
.diag-card .dc-t{font-size:14px;font-weight:700;margin-bottom:5px}
.diag-card .dc-b{font-size:13px;line-height:1.6}

/* TOAST */
.toast{position:fixed;top:calc(var(--safe-t) + 10px);left:12px;right:12px;
  background:var(--t1);border-radius:var(--r2);padding:13px 16px;z-index:500;
  transform:translateY(-130%);transition:.3s cubic-bezier(.32,0,.16,1);
  box-shadow:var(--sh2)}
.toast.show{transform:translateY(0)}
.t-tit{font-size:14px;font-weight:700;color:#fff}
.t-bdy{font-size:13px;color:rgba(255,255,255,.7);margin-top:2px}

/* SECTION TITLE */
.s-hdr{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
.s-hdr .s-t{font-size:20px;font-weight:700;color:var(--t1)}
.s-hdr .s-sub{font-size:13px;color:var(--t2);margin-left:auto;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"><div class="t-tit" id="t-ttl"></div><div class="t-bdy" id="t-bdy"></div></div>
<button class="fab" id="fab" onclick="onFab()">＋</button>
<div class="ovl" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><span class="sh-hdl"></span><div id="sh-in"></div></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════════════ */
const DS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CATS={
  cabinet:{l:'Cabinet',   c:'#1E6FB5',bg:'rgba(30,111,181,.08)'},
  perso:  {l:'Clientèle', c:'#0E7A5F',bg:'rgba(14,122,95,.08)'},
  ia:     {l:'Bus. IA',   c:'#5B51F7',bg:'rgba(91,81,247,.08)'},
  sport:  {l:'Sport',     c:'#C47D0A',bg:'rgba(196,125,10,.08)'},
  routine:{l:'Routine',   c:'#6B7280',bg:'rgba(107,114,128,.08)'},
  lecture:{l:'Lecture',   c:'#B04A26',bg:'rgba(176,74,38,.08)'},
  social: {l:'Social',    c:'#B03668',bg:'rgba(176,54,104,.08)'},
};
const QD={
  1:{l:'Urgent & Important',s:'Faire maintenant',c:'#CC3B3B',e:'🔴'},
  2:{l:'Important',         s:'Planifier',       c:'#0E7A5F',e:'🟢'},
  3:{l:'Urgent',            s:'Déléguer',         c:'#C47D0A',e:'🟡'},
  4:{l:'Ni urgent ni imp.', s:'Éliminer',         c:'#6B7280',e:'⚫'},
};
const BRAIN_HACKS=[
  {n:1,title:'CAR — Cortisol Awakening Response',ctx:'Huberman Lab, 2021',col:'#5B51F7',tag:'Appliquer 08h20 chaque matin',
   desc:'Le cortisol atteint son pic dans les 30–45 min après le réveil : c\'est ta fenêtre de concentration maximale. Le bloc 08h20–09h20 doit contenir ta tâche la plus difficile — jamais les emails, jamais le cabinet. C\'est là que se construit ton patrimoine professionnel, pas ailleurs. Ajouter 2 à 10 min de lumière naturelle au réveil amplifie cet effet.'},
  {n:2,title:'Implementation intentions',ctx:'Gollwitzer, 1999',col:'#0E7A5F',tag:'Pour chaque séance de sport',
   desc:'"Je vais aller à la salle" → 20% de réussite. "Si je sors du cabinet à 18h, alors je vais directement à la salle sans passer chez moi" → 60–70% de réussite. Cette formulation SI–ALORS réduit le taux d\'abandon de plus de 50% selon les études. Le passage par chez soi est l\'ennemi n°1 du sport du soir.'},
  {n:3,title:'Temptation bundling',ctx:'Milkman, Wharton 2014',col:'#C47D0A',tag:'Sport + anglais en simultané',
   desc:'Écouter des podcasts EN ANGLAIS uniquement pendant le sport ou le trajet. Tu couples une contrainte (sport) avec un contenu stimulant, et tu fais de l\'anglais simultanément. Double gain, zéro temps supplémentaire. Suggestions : "How I Built This", "My First Million", "Acquired".'},
  {n:4,title:'Single tasking obligatoire',ctx:'Rubinstein, Meyer & Evans, 2001',col:'#1E6FB5',tag:'Blocs IA et clientèle perso',
   desc:'Le cerveau ne fait pas de multitâche : il switche et perd 15 à 20% d\'efficacité à chaque transition. Pendant un bloc IA ou clientèle perso : fermer tous les onglets hors projet, mode avion, timer 90 min, UNE seule tâche écrite avant de commencer. Pas "réfléchir à la stratégie" : une sortie tangible par session.'},
  {n:5,title:'La règle du démarrage ridicule',ctx:'Fogg, Tiny Habits',col:'#B04A26',tag:'Quand la motivation est basse',
   desc:'Quand tu bloques, ne négocie pas la séance complète. Engage-toi uniquement sur : 5 min de sport, 5 lignes de lecture, 1 message prospect, 3 min de méditation. Dans 80% des cas tu continues. Dans 20%, tu as quand même protégé l\'habitude. Le cerveau adore les portes d\'entrée minuscules parce qu\'il est manipulable.'},
  {n:6,title:'Pré-engagement la veille',ctx:'Behaviour design',col:'#0E7A5F',tag:'Chaque soir avant de dormir',
   desc:'Chaque soir : sac de sport préparé, tenue posée, livre anglais sur l\'oreiller, 3 priorités du lendemain écrites, 1er message prospect en brouillon. Le matin, tu n\'as plus à décider. Décider fatigue (ego depletion). Exécuter enrichit. Chaque décision éliminée le soir est une unité d\'énergie cognitive disponible demain matin.'},
  {n:7,title:'Don\'t break the chain',ctx:'Méthode Seinfeld',col:'#5B51F7',tag:'Sport, lecture, méditation',
   desc:'Calendrier mensuel papier visible dans ta chambre ou ton bureau. Chaque jour où tu complètes sport + lecture + méditation : grande croix rouge. L\'objectif devient de ne pas briser la chaîne. Le support physique est prouvé plus efficace que les apps de tracking pour l\'ancrage des habitudes sur 3 à 6 mois.'},
  {n:8,title:'Scoreboard quotidien — 80%, pas 100%',ctx:'GTD + recherche sur la performance',col:'#C47D0A',tag:'6 cases à cocher chaque jour',
   desc:'Suivre 6 cases/jour : sommeil (6h30 min), méditation (10 min), lecture anglais (30 min), sport (selon planning), clientèle perso (1 action min), IA (mar/ven/sam/dim). Objectif : 80% minimum, pas 100%. Le perfectionnisme à 100% transforme les ambitieux en paralysés. 80% répété 50 semaines bat 100% répété 4 semaines.'},
  {n:9,title:'Friction engineering',ctx:'Behaviour design, Thaler',col:'#B03668',tag:'Modifier l\'environnement ce soir',
   desc:'Rendre les bonnes habitudes physiquement plus faciles, les mauvaises plus difficiles. Téléphone chargé dans une autre pièce (pas au lit). Sac de sport à la porte. Livre sur la table. Réseaux sociaux hors de l\'écran d\'accueil. Chaque obstacle supprimé augmente la probabilité d\'un bon comportement de 20 à 40%.'},
  {n:10,title:'Pre-commitment + accountability',ctx:'Ariely, Kahneman — théorie des perspectives',col:'#1E6FB5',tag:'Objectif clientèle perso',
   desc:'La pression de perte est 2x plus motivante que le gain attendu. Annonce à 3 contacts un objectif mesurable (X clients perso d\'ici 6 mois). Conviens d\'un check mensuel avec un pair. La possibilité de perte sociale crée une pression continue que la motivation intrinsèque seule ne peut pas égaler sur la durée.'},
];

const st={view:'week',day:(new Date().getDay()+6)%7,tasks:[],matrix:[],timers:{}};
const LT='pl_t4',LM='pl_m4';
function save(){localStorage.setItem(LT,JSON.stringify(st.tasks));localStorage.setItem(LM,JSON.stringify(st.matrix));}
function load(){
  try{st.tasks=JSON.parse(localStorage.getItem(LT)||'null')||JSON.parse(JSON.stringify(DEF));}
  catch(e){st.tasks=JSON.parse(JSON.stringify(DEF));}
  try{st.matrix=JSON.parse(localStorage.getItem(LM)||'null')||[];}
  catch(e){st.matrix=[];}
}
function uid(){return'x'+Math.random().toString(36).substr(2,9)+Date.now().toString(36);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* week dates */
function weekDates(){
  const today=new Date(),dow=today.getDay(),off=dow===0?-6:1-dow;
  const mon=new Date(today);mon.setDate(today.getDate()+off);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.getDate();});
}

/* ══════════════════════════════════════════════════════════
   NOTIFICATIONS
══════════════════════════════════════════════════════════ */
async function askNotif(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='default')await Notification.requestPermission();
  return Notification.permission==='granted';
}
let _tt=null;
function toast(ttl,bdy,ms=4200){
  const el=document.getElementById('toast');
  document.getElementById('t-ttl').textContent=ttl;
  document.getElementById('t-bdy').textContent=bdy;
  el.classList.add('show');
  if(_tt)clearTimeout(_tt);
  _tt=setTimeout(()=>el.classList.remove('show'),ms);
}
function fireNotif(title,body){
  toast('⏰ '+title,body);
  if(Notification.permission==='granted'){
    try{new Notification('⏰ '+title,{body,icon:'/favicon.ico'});}catch(e){}
  }
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}

/* Calendar task reminders */
function schedTask(tk){
  if(!tk.r)return;
  unschedTask(tk.id);
  const now=new Date(),tod=(now.getDay()+6)%7;
  if(tk.d!==tod)return;
  const[h,m]=tk.s.split(':').map(Number);
  const tMs=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0).getTime();
  const delay=tMs-tk.r*60000-Date.now();
  const cat=CATS[tk.c]||CATS.routine;
  if(delay>0)st.timers[tk.id]=setTimeout(()=>fireNotif(tk.t,`Commence dans ${tk.r} min — ${cat.l}`),delay);
}
function unschedTask(id){if(st.timers[id]){clearTimeout(st.timers[id]);delete st.timers[id];}}

/* Matrix task reminders */
function schedMatrix(mk){
  if(!mk.rem||!mk.rem.time||!mk.rem.days||!mk.rem.days.length)return;
  unschedTask('m_'+mk.id);
  const now=new Date(),tod=(now.getDay()+6)%7;
  if(!mk.rem.days.includes(tod))return;
  const[h,m]=mk.rem.time.split(':').map(Number);
  const tMs=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0).getTime();
  const delay=tMs-Date.now();
  if(delay>0)st.timers['m_'+mk.id]=setTimeout(()=>fireNotif(mk.t,'Rappel Eisenhower — '+QD[mk.q].l),delay);
}
function schedAll(){
  st.tasks.forEach(t=>{if(t.r)schedTask(t);});
  st.matrix.forEach(m=>{if(m.rem)schedMatrix(m);});
}

    </div>
    <div class="fg">
      <label class="fl">Ajouter à Eisenhower</label>
      <div class="q-g">
        <div class="q-btn${T._q===0?' on':''}" style="${T._q===0?'border-color:var(--acc);background:var(--acc2)':''}" onclick="setTq(0)">
          <div class="ql" style="color:var(--t2)">Aucun</div></div>
        ${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T._q===q?' on':''}" style="${T._q===q?'border-color:'+qd.c+';background:'+qd.c+'12':''}" onclick="setTq(${q})">
          <div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div>
          <div class="qs" style="color:${qd.c}">${qd.s}</div>
        </div>`;}).join('')}
      </div>
    </div>
    <button class="btn-p" onclick="saveTask()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delTask('${T.id}')">Supprimer la tâche</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{ const el=document.getElementById('et-t'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}
function setTd(d){ET.d=d;shTask();}
function setTc(c){ET.c=c;shTask();}
function setTr(r){ET.r=r;shTask();}
function setTq(q){ET._q=q;shTask();}

function saveTask(){
  const T=ET;
  const el=document.getElementById('et-t');
  if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre manquant','Ajoute un nom à la tâche.');return;}
  const nq=T._q||0;
  const lm=T.mid?st.matrix.find(m=>m.id===T.mid):null;
  if(nq>0){
    if(lm){lm.q=nq;lm.t=T.t;}
    else{const nid=uid();st.matrix.push({id:nid,t:T.t,q:nq,cid:T.id,rem:null});T.mid=nid;}
  }else if(nq===0&&T.mid){
    st.matrix=st.matrix.filter(m=>m.id!==T.mid);T.mid=null;
  }
  const{_q,...td}=T;
  if(td.id){
    const i=st.tasks.findIndex(x=>x.id===td.id);
    if(i>=0)st.tasks[i]={...td};
    unschedTask(td.id);if(td.r)schedTask(td);
  }else{
    td.id=uid();
    if(td.mid){const mt=st.matrix.find(m=>m.id===td.mid);if(mt)mt.cid=td.id;}
    st.tasks.push(td);if(td.r)schedTask(td);
  }
  save();closeSheet();R();
}
function delTask(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const t=st.tasks.find(x=>x.id===id);
  if(t?.mid)st.matrix=st.matrix.filter(m=>m.id!==t.mid);
  unschedTask(id);st.tasks=st.tasks.filter(x=>x.id!==id);
  save();closeSheet();R();
}

/* ══════════════════════════════════════════════════════════
   MATRIX CRUD
══════════════════════════════════════════════════════════ */
let EM=null;
function addMat(q){EM={id:null,t:'',q,cid:null,rem:null};shMat();}
function editMatrix(id){const t=st.matrix.find(x=>x.id===id);if(!t)return;EM={...t,rem:t.rem?{...t.rem,days:[...(t.rem.days||[])]}:{null:true}};if(EM.rem&&EM.rem.null){EM.rem=null;}shMat();}

function shMat(){
  const T=EM;
  const cal=T.cid?st.tasks.find(x=>x.id===T.cid):null;
  const rem=T.rem||{time:'09:00',days:[]};
  const hasRem=T.rem&&T.rem.time&&T.rem.days&&T.rem.days.length>0;
  openSheet(`
  <div class="sh-row"><span class="sh-tit">${T.id?'Modifier':'Nouvelle tâche'}</span>
    <button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <div class="fg">
      <label class="fl">Titre</label>
      <input class="fi" id="em-t" value="${esc(T.t)}" placeholder="Nom de la tâche"
        oninput="EM.t=this.value" maxlength="80" autocomplete="off">
    </div>
    <div class="fg">
      <label class="fl">Quadrant</label>
      <div class="q-g">${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T.q===q?' on':''}" style="${T.q===q?'border-color:'+qd.c+';background:'+qd.c+'12':''}" onclick="setMq(${q})">
        <div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div>
        <div class="qs" style="color:${qd.c}">${qd.l}</div>
      </div>`;}).join('')}</div>
    </div>
    <div class="fg">
      <label class="fl">Rappel récurrent</label>
      <div style="background:var(--bg3);border-radius:var(--r2);padding:14px;border:1px solid var(--bdr)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${hasRem?'12':'0'}px">
          <span style="font-size:14px;font-weight:500;color:var(--t1)">Activer un rappel</span>
          <button class="hdr-btn tog" id="rem-tog" onclick="toggleMatRem()" style="${hasRem?'background:var(--acc);color:#fff;border-color:var(--acc)':''}">${hasRem?'✓':'○'}</button>
        </div>
        <div id="rem-opts" style="display:${hasRem?'block':'none'}">
          <div class="sub-lbl" style="margin-bottom:6px">Heure</div>
          <input type="time" class="fi" id="rem-time" value="${rem.time||'09:00'}" onchange="setMatRemTime(this.value)" style="margin-bottom:12px">
          <div class="sub-lbl" style="margin-bottom:6px">Jours de la semaine</div>
          <div class="days-g">
            ${DS.map((d,i)=>`<div class="days-btn${(rem.days||[]).includes(i)?' on':''}" onclick="toggleMatDay(${i})">${d.slice(0,2)}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    ${cal?`<div class="divl"></div><div class="info-row"><span>📅 Lié au calendrier : <strong>${esc(cal.t)}</strong></span></div>`:''}
    <button class="btn-p" onclick="saveMat()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delMat('${T.id}')">Supprimer</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{const el=document.getElementById('em-t');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}

function toggleMatRem(){
  const btn=document.getElementById('rem-tog');
  const opts=document.getElementById('rem-opts');
  if(!opts)return;
  const active=opts.style.display==='none';
  opts.style.display=active?'block':'none';
  if(btn){btn.textContent=active?'✓':'○';btn.style.background=active?'var(--acc)':'';btn.style.color=active?'#fff':'';btn.style.borderColor=active?'var(--acc)':'';}
  if(!active){EM.rem=null;}
  else{if(!EM.rem)EM.rem={time:'09:00',days:[0,1,2,3,4]};}
  // re-render days
  const dg=document.querySelector('.days-g');
  if(dg&&EM.rem)dg.querySelectorAll('.days-btn').forEach((b,i)=>{b.classList.toggle('on',(EM.rem.days||[]).includes(i));});
}
function setMatRemTime(v){if(!EM.rem)EM.rem={time:v,days:[]};else EM.rem.time=v;}
function toggleMatDay(i){
  if(!EM.rem)EM.rem={time:'09:00',days:[]};
  const days=EM.rem.days||[];
  const idx=days.indexOf(i);
  if(idx>=0)days.splice(idx,1);else days.push(i);
  EM.rem.days=days;
  document.querySelectorAll('.days-btn').forEach((b,j)=>b.classList.toggle('on',days.includes(j)));
}
function setMq(q){EM.q=q;shMat();}

function saveMat(){
  const T=EM;
  const el=document.getElementById('em-t');
  if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre manquant','Ajoute un nom.');return;}
  // validate rem
  if(T.rem&&(!T.rem.days||T.rem.days.length===0))T.rem=null;
  if(T.id){
    const i=st.matrix.findIndex(x=>x.id===T.id);
    if(i>=0)st.matrix[i]={...T};
    unschedTask('m_'+T.id);if(T.rem)schedMatrix(T);
    if(T.cid){const ct=st.tasks.find(x=>x.id===T.cid);if(ct)ct.t=T.t;}
  }else{
    T.id=uid();st.matrix.push({...T});
    if(T.rem)schedMatrix(T);
  }
  save();closeSheet();R();
}
function delMat(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const mt=st.matrix.find(x=>x.id===id);
  if(mt?.cid){const ct=st.tasks.find(x=>x.id===mt.cid);if(ct)ct.mid=null;}
  unschedTask('m_'+id);
  st.matrix=st.matrix.filter(x=>x.id!==id);
  save();closeSheet();R();
}

/* ══════════════════════════════════════════════════════════
   NOTIF + PWA
══════════════════════════════════════════════════════════ */
async function doNotif(){
  const ok=await askNotif();
  if(ok){schedAll();toast('🔔 Rappels activés','Les rappels d\'aujourd\'hui sont programmés.');}
  else toast('Notifications désactivées','Autorise dans Réglages → Safari → Notifications du site.');
}
function setupPWA(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="%235B51F7"/><rect x="20" y="26" width="80" height="10" rx="5" fill="white" opacity=".95"/><rect x="20" y="44" width="58" height="8" rx="4" fill="white" opacity=".7"/><rect x="20" y="60" width="68" height="8" rx="4" fill="white" opacity=".7"/><rect x="20" y="76" width="48" height="8" rx="4" fill="white" opacity=".7"/></svg>`;
  const m={name:'Mon Planning',short_name:'Planning',start_url:'.',display:'standalone',
    background_color:'#F4F6FC',theme_color:'#5B51F7',
    icons:[{src:'data:image/svg+xml,'+svg,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};
  try{const b=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(b);document.head.appendChild(l);}catch(e){}
  if('serviceWorker' in navigator){
    const sw=`self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',()=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('Hors ligne',{headers:{'Content-Type':'text/plain'}}))));`;
    try{const b=new Blob([sw],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(b),{scope:'./'}).catch(()=>{});}catch(e){}
  }
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
setupPWA();load();askNotif();schedAll();R();
</script>
</body>
