<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="theme-color" content="#070C1A">
<link rel="manifest" href="manifest.json">
<title>Mon Planning</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#070C1A;
  --g1:rgba(255,255,255,.058);--g2:rgba(255,255,255,.1);--g3:rgba(255,255,255,.04);
  --t1:#EEF1FF;--t2:#7B87A8;--t3:#3E4A68;
  --bdr:rgba(255,255,255,.09);--bdr2:rgba(255,255,255,.15);
  --acc:#4A6CF7;--acc2:rgba(74,108,247,.18);--acc3:rgba(74,108,247,.08);
  --gold:#C8A45A;--gold2:rgba(200,164,90,.15);
  --cab:#5B9EF5;--per:#34D1A0;--ia:#A78BFA;
  --spt:#FBBF24;--rut:#94A3B8;--lec:#FB7748;--soc:#F472B6;
  --q1:#F16363;--q2:#34D1A0;--q3:#FBBF24;--q4:#94A3B8;
  --r:20px;--r2:14px;--r3:40px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --sh:0 4px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  --sh2:0 12px 48px rgba(0,0,0,.55);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* BACKGROUND ORBS */
body::before{content:'';position:fixed;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,108,247,.13) 0%,transparent 70%);
  top:-160px;right:-120px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,164,90,.09) 0%,transparent 70%);
  bottom:60px;left:-120px;pointer-events:none;z-index:0}

#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t);overflow:hidden;position:relative;z-index:1}

/* GLASS MIXIN */
.glass{background:var(--g1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--bdr);border-radius:var(--r)}

/* HEADER */
.hdr{padding:18px 22px 6px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between}
.hdr-l .h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:700;
  letter-spacing:-.3px;background:linear-gradient(135deg,#EEF1FF 30%,#C8A45A);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.hdr-l .h2{font-size:12px;color:var(--t2);margin-top:4px;font-weight:400;letter-spacing:.3px;text-transform:uppercase}
.hdr-btn{width:38px;height:38px;border-radius:50%;background:var(--g1);border:1px solid var(--bdr);
  color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-top:2px;transition:.15s}
.hdr-btn:active{background:var(--g2)}

/* DAY SELECTOR */
.ds-wrap{display:flex;gap:8px;padding:8px 22px 14px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ds-wrap::-webkit-scrollbar{display:none}
.dp{min-width:52px;height:70px;border-radius:18px;background:var(--g1);
  border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;cursor:pointer;flex-shrink:0;transition:.2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dp.today{border-color:rgba(200,164,90,.45);box-shadow:0 0 16px rgba(200,164,90,.12)}
.dp.active{background:linear-gradient(145deg,#4A6CF7,#7C3AED);border-color:transparent;
  box-shadow:0 6px 24px rgba(74,108,247,.45)}
.dp .dn{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px}
.dp .dd{font-size:20px;font-weight:700;color:var(--t1);margin-top:1px}
.dp .dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:3px}
.dp.has-t .dot{background:var(--acc)}
.dp.active .dn,.dp.active .dd{color:#fff}
.dp.active .dot{background:rgba(255,255,255,.6)}
.dp.today:not(.active) .dn,.dp.today:not(.active) .dd{color:var(--gold)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:0 16px 110px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* TASK CARDS */
.tlist{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tc{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--r);
  padding:16px 18px;border-left:3px solid;border-right:1px solid var(--bdr);
  border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);
  cursor:pointer;transition:.14s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.tc:active{transform:scale(.975);opacity:.85}
.tc-t{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.35}
.tc-time{font-size:12px;color:var(--t2);font-weight:500;letter-spacing:.2px}
.tc-meta{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 11px;border-radius:var(--r3);
  text-transform:uppercase;letter-spacing:.4px}
.rbadge{font-size:11px;color:var(--t2);font-weight:500}
.mbadge{font-size:11px;font-weight:600}

/* EMPTY STATE */
.empty{text-align:center;padding:70px 20px}
.empty .ei{font-size:44px;margin-bottom:16px;opacity:.7}
.empty .et{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;color:var(--t1);margin-bottom:8px}
.empty .es{font-size:14px;color:var(--t2);line-height:1.6}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(7,12,26,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-top:1px solid rgba(255,255,255,.08);padding-bottom:var(--safe-b);z-index:90}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0;cursor:pointer;color:var(--t3);gap:3px;border:none;background:none;
  font-family:'Inter',sans-serif;transition:.2s}
.ni.active{color:var(--acc)}
.ni-ico{font-size:22px;line-height:1}
.ni-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* FAB */
.fab{position:fixed;right:22px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,var(--gold),#A8802A);border:none;color:#fff;
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 28px rgba(200,164,90,.5),0 2px 8px rgba(200,164,90,.3);
  z-index:91;transition:.15s;color:#1A1200}
.fab:active{transform:scale(.88)}

/* OVERLAY + SHEET */
.ovl{position:fixed;inset:0;background:rgba(4,8,20,.75);z-index:200;opacity:0;
  pointer-events:none;transition:.22s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ovl.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg,#0E1528 0%,#0A1020 100%);
  border-radius:24px 24px 0 0;z-index:201;transform:translateY(102%);
  transition:.34s cubic-bezier(.32,0,.16,1);max-height:93vh;overflow-y:auto;
  padding-bottom:calc(var(--safe-b)+12px);scrollbar-width:none;
  box-shadow:0 -12px 48px rgba(0,0,0,.6);border-top:1px solid rgba(255,255,255,.1)}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.sh-hdl{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:14px auto 0;display:block}
.sh-row{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px}
.sh-tit{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;
  background:linear-gradient(135deg,#EEF1FF,#C8A45A);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.sh-x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);color:var(--t2);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.sh-body{padding:6px 22px 14px}

/* FORM */
.fg{margin-bottom:16px}
.fl{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:8px;display:block;
  text-transform:uppercase;letter-spacing:.9px}
.fi{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 16px;font-size:16px;color:var(--t1);outline:none;
  -webkit-appearance:none;font-family:'Inter',sans-serif;-webkit-user-select:auto;
  user-select:auto;transition:.2s;caret-color:var(--gold)}
.fi:focus{border-color:rgba(74,108,247,.6);background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(74,108,247,.15)}
.fi::placeholder{color:var(--t3)}
input[type=time].fi{color-scheme:dark}
input[type=date].fi{color-scheme:dark}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-lbl{font-size:10px;color:var(--t3);margin-bottom:6px;font-weight:700;
  text-transform:uppercase;letter-spacing:.7px}

/* GRIDS */
.day-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day-btn{padding:11px 4px;border-radius:14px;border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:12px;font-weight:600;cursor:pointer;
  text-align:center;color:var(--t2);font-family:'Inter',sans-serif;transition:.14s}
.day-btn.on{border-color:var(--acc);color:#fff;background:rgba(74,108,247,.25)}
.cat-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-btn{padding:9px 4px;border-radius:12px;border:2px solid transparent;
  background:rgba(255,255,255,.05);font-size:10px;font-weight:700;cursor:pointer;
  text-align:center;transition:.14s;text-transform:uppercase;letter-spacing:.3px;
  line-height:1.3;font-family:'Inter',sans-serif;color:var(--t2)}
.cat-btn.on{border-color:currentColor;background:rgba(255,255,255,.08)}
.rem-row{display:flex;gap:8px;flex-wrap:wrap}
.rem-btn{padding:9px 14px;border-radius:var(--r3);border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:13px;color:var(--t2);cursor:pointer;
  font-family:'Inter',sans-serif;transition:.14s}
.rem-btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.q-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-btn{padding:12px 10px;border-radius:16px;border:2px solid rgba(255,255,255,.08);
  cursor:pointer;text-align:center;background:rgba(255,255,255,.04);
  font-family:'Inter',sans-serif;transition:.14s}
.q-btn .ql{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.q-btn .qs{font-size:10px;margin-top:3px;opacity:.7}
.q-btn.on{border-width:2px}
.days-g{display:flex;gap:6px;flex-wrap:wrap}
.days-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;color:var(--t2);display:flex;align-items:center;
  justify-content:center;transition:.14s}
.days-btn.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.tog-lbl{font-size:14px;font-weight:500;color:var(--t1)}
.tog{width:50px;height:28px;border-radius:14px;background:rgba(255,255,255,.1);
  border:none;cursor:pointer;position:relative;transition:.22s;flex-shrink:0}
.tog.on{background:var(--acc)}
.tog::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:.22s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tog.on::after{left:25px}

/* REM MODE TABS */
.mode-tabs{display:flex;gap:0;background:rgba(255,255,255,.06);border-radius:12px;
  padding:3px;margin-bottom:14px;border:1px solid rgba(255,255,255,.08)}
.mode-tab{flex:1;padding:9px;border-radius:10px;border:none;background:transparent;
  color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:.15s}
.mode-tab.on{background:var(--acc);color:#fff;box-shadow:0 3px 12px rgba(74,108,247,.4)}

/* VIB OPTION */
.vib-row{display:flex;gap:8px;margin-top:8px}
.vib-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);font-size:13px;color:var(--t2);cursor:pointer;
  font-family:'Inter',sans-serif;text-align:center;font-weight:600;transition:.14s}
.vib-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(200,164,90,.12)}

/* BUTTONS */
.btn-p{width:100%;padding:16px;border-radius:16px;
  background:linear-gradient(135deg,#4A6CF7,#7C3AED);color:#fff;
  font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:10px;
  font-family:'Inter',sans-serif;box-shadow:0 6px 22px rgba(74,108,247,.4);transition:.15s}
.btn-p:active{opacity:.82;transform:scale(.98)}
.btn-d{width:100%;padding:14px;border-radius:16px;background:rgba(241,99,99,.1);
  color:var(--q1);font-size:15px;font-weight:700;border:1px solid rgba(241,99,99,.25);
  cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif}
.btn-s{width:100%;padding:14px;border-radius:16px;background:rgba(255,255,255,.06);
  color:var(--t2);font-size:15px;font-weight:600;border:1.5px solid rgba(255,255,255,.1);
  cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif}
.divl{height:1px;background:rgba(255,255,255,.07);margin:16px 0}
.info-box{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(255,255,255,.05);border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.info-box span{font-size:13px;color:var(--t2);flex:1;line-height:1.5}

/* REM PANEL */
.rem-panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:16px;margin-top:4px}

/* EISENHOWER */
.mat-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:110px}
.mat-wrap::-webkit-scrollbar{display:none}
.mat-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 16px}
.quad{border-radius:22px;padding:16px 14px;backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid var(--bdr);
  display:flex;flex-direction:column;gap:8px;min-height:175px;
  box-shadow:0 4px 24px rgba(0,0,0,.35)}
.q-hd{margin-bottom:3px}
.q-nm{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.q-lbl{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-weight:700;
  margin-top:2px;line-height:1.25;color:var(--t1)}
.q-hint{font-size:10px;color:var(--t2);margin-top:2px;letter-spacing:.2px}
.qt{background:rgba(0,0,0,.2);border-radius:12px;padding:9px 11px;font-size:13px;
  font-weight:500;cursor:pointer;display:flex;align-items:flex-start;
  justify-content:space-between;gap:5px;transition:.14s;line-height:1.35;
  border:1px solid rgba(255,255,255,.06)}
.qt:active{transform:scale(.95)}
.qt-tx{flex:1;color:var(--t1)}
.qt-ic{font-size:11px;flex-shrink:0;color:var(--t3);display:flex;gap:3px;margin-top:1px}
.q-add{background:transparent;border-radius:12px;padding:8px 11px;font-size:12px;
  color:var(--t3);cursor:pointer;display:flex;align-items:center;gap:6px;
  border:1.5px dashed rgba(255,255,255,.1);margin-top:2px;font-weight:500;transition:.14s}
.q-add:active{background:rgba(255,255,255,.05)}

/* BRAIN HACKING */
.brain-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:110px}
.brain-wrap::-webkit-scrollbar{display:none}
.brain-body{padding:4px 16px 8px}
.sec-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:.9px;padding:16px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.hk-card{background:var(--g1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:20px;margin-bottom:9px;border:1px solid var(--bdr);
  box-shadow:0 2px 16px rgba(0,0,0,.25);overflow:hidden;cursor:pointer}
.hk-top{display:flex;align-items:center;gap:13px;padding:15px 18px}
.hk-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.hk-info{flex:1}
.hk-title{font-size:14px;font-weight:600;color:var(--t1);line-height:1.3}
.hk-ctx{font-size:10px;color:var(--t3);margin-top:2px;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.hk-arr{font-size:18px;color:var(--t3);flex-shrink:0;transition:.22s;line-height:1;font-weight:300}
.hk-body{padding:0 18px 16px;display:none}
.hk-body.open{display:block}
.hk-sep{height:1px;background:rgba(255,255,255,.07);margin-bottom:14px}
.hk-desc{font-size:13px;color:var(--t2);line-height:1.7}
.hk-tag{display:inline-block;font-size:10px;font-weight:700;padding:5px 12px;
  border-radius:var(--r3);margin-top:12px;text-transform:uppercase;letter-spacing:.5px}
.diag{border-radius:20px;padding:16px 18px;margin-bottom:9px;border-left:3px solid;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--bdr);border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr)}
.diag-t{font-size:14px;font-weight:700;margin-bottom:7px;line-height:1.35}
.diag-b{font-size:13px;color:var(--t2);line-height:1.68}

/* TOAST */
.toast{position:fixed;top:calc(var(--safe-t) + 12px);left:14px;right:14px;
  background:rgba(14,21,40,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:18px;padding:14px 18px;z-index:500;transform:translateY(-135%);
  transition:.32s cubic-bezier(.32,0,.16,1);box-shadow:var(--sh2);
  border:1px solid rgba(255,255,255,.12)}
.toast.show{transform:translateY(0)}
.t-tit{font-size:14px;font-weight:700;color:var(--t1)}
.t-bdy{font-size:13px;color:var(--t2);margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"><div class="t-tit" id="t-ttl"></div><div class="t-bdy" id="t-bdy"></div></div>
<button class="fab" id="fab" onclick="onFab()">＋</button>
<div class="ovl" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><span class="sh-hdl"></span><div id="sh-in"></div></div>
<script>
/* ══ CONSTANTS ══════════════════════════════════════════════════════════════ */
const DS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CATS={
  cabinet:{l:'Cabinet',  c:'#5B9EF5',bg:'rgba(91,158,245,.1)'},
  perso:  {l:'Clientèle',c:'#34D1A0',bg:'rgba(52,209,160,.1)'},
  ia:     {l:'Bus. IA',  c:'#A78BFA',bg:'rgba(167,139,250,.1)'},
  sport:  {l:'Sport',    c:'#FBBF24',bg:'rgba(251,191,36,.1)'},
  routine:{l:'Routine',  c:'#94A3B8',bg:'rgba(148,163,184,.08)'},
  lecture:{l:'Lecture',  c:'#FB7748',bg:'rgba(251,119,72,.1)'},
  social: {l:'Social',   c:'#F472B6',bg:'rgba(244,114,182,.1)'},

}

/* Compute next fireAt for a given weekday + time */
function nextFireAt(dayOfWeek,timeStr,minsBefore=0){
  const now=new Date(),today=(now.getDay()+6)%7;
  let diff=(dayOfWeek-today+7)%7;
  if(diff===0){
    const[h,m]=timeStr.split(':').map(Number);
    const tMs=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m).getTime()-minsBefore*60000;
    if(tMs<=Date.now())diff=7;
  }
  const tgt=new Date(now);tgt.setDate(now.getDate()+diff);
  const[h,m]=timeStr.split(':').map(Number);
  tgt.setHours(h,m,0,0);
  return tgt.getTime()-minsBefore*60000;
}

function schedAll(){
  const reminders=[];
  st.tasks.forEach(tk=>{
    if(!tk.r)return;
    const fireAt=nextFireAt(tk.d,tk.s,tk.r);
    const cat=CATS[tk.c]||CATS.routine;
    reminders.push({id:'tk_'+tk.id,title:tk.t,body:`Commence dans ${tk.r} min — ${cat.l}`,fireAt,vibrate:tk.rv!==false});
    // Fallback local timer
    const delay=fireAt-Date.now();
    if(delay>0&&delay<24*3600*1000)setTimeout(()=>fireLocal(tk.t,`Commence dans ${tk.r} min`),delay);
  });
  st.matrix.forEach(mk=>{
    if(!mk.rem)return;
    const rem=mk.rem;
    const days=rem.mode==='recurring'?(rem.days||[]):(rem.date?[-1]:[]);
    if(rem.mode==='unique'&&rem.date&&rem.time){
      const[y,mo,d]=rem.date.split('-').map(Number);
      const[h,mi]=rem.time.split(':').map(Number);
      const fireAt=new Date(y,mo-1,d,h,mi).getTime();
      if(fireAt>Date.now())reminders.push({id:'mk_'+mk.id,title:mk.t,body:'Rappel Eisenhower — '+QD[mk.q].l,fireAt,vibrate:rem.vibrate!==false});
    } else if(rem.mode==='recurring'&&rem.days&&rem.days.length&&rem.time){
      rem.days.forEach((day,i)=>{
        const fireAt=nextFireAt(day,rem.time);
        if(fireAt>Date.now())reminders.push({id:'mk_'+mk.id+'_'+i,title:mk.t,body:'Rappel Eisenhower — '+QD[mk.q].l,fireAt,vibrate:rem.vibrate!==false});
      });
    }
  });
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){
    sendSW({type:'RESCHEDULE_ALL',reminders});
  } else if(swReg){
    swReg.active&&swReg.active.postMessage({type:'RESCHEDULE_ALL',reminders});
  }
}

          const cal=x.cid?st.tasks.find(t=>t.id===x.cid):null;
          const hr=x.rem&&((x.rem.mode==='unique'&&x.rem.date)||(x.rem.mode==='recurring'&&x.rem.days&&x.rem.days.length));
          return`<div class="qt" onclick="editMatrix('${x.id}')">
            <span class="qt-tx">${esc(x.t)}</span>
            <span class="qt-ic">${cal?'📅':''}${hr?'🔔':''}</span>
          </div>`;
        }).join('')}
        <div class="q-add" onclick="addMat(${q})"><span style="color:var(--gold);font-size:16px">＋</span><span>Ajouter</span></div>
      </div>`;
    }).join('')}
  </div></div>${NAV()}`;
}
function renderBrain(app){
  app.innerHTML=`
  <div class="hdr">
    <div class="hdr-l"><div class="h1">Brain Hacking</div>
      <div class="h2">Techniques · Diagnostic</div></div>
  </div>
  <div class="brain-wrap"><div class="brain-body">
    <div class="sec-lbl">⚡ 10 Techniques de performance</div>
    ${HACKS.map((h,i)=>`
    <div class="hk-card" onclick="tHk(${i})">
      <div class="hk-top">
        <div class="hk-num" style="background:${h.c}20;color:${h.c}">${h.n}</div>
        <div class="hk-info"><div class="hk-title">${h.title}</div><div class="hk-ctx">${h.ctx}</div></div>
        <div class="hk-arr" id="arr${i}">›</div>
      </div>
      <div class="hk-body" id="hkb${i}">
        <div class="hk-sep"></div>
        <div class="hk-desc">${h.desc}</div>
        <span class="hk-tag" style="background:${h.c}18;color:${h.c}">${h.tag}</span>
      </div>
    </div>`).join('')}
    <div class="sec-lbl" style="margin-top:6px">🔍 Diagnostic honnête</div>
    ${DIAG.map(d=>`
    <div class="diag" style="background:${d.bg};border-left-color:${d.c}">
      <div class="diag-t" style="color:${d.c}">${d.i} ${d.t}</div>
      <div class="diag-b">${d.b}</div>
    </div>`).join('')}
    <div style="height:20px"></div>
  </div></div>${NAV()}`;
}
function tHk(i){
  const b=document.getElementById('hkb'+i),a=document.getElementById('arr'+i);
  if(!b)return;const o=b.classList.toggle('open');
  if(a)a.style.transform=o?'rotate(90deg)':'rotate(0deg)';
}

/* ══ NAV ═════════════════════════════════════════════════════════════════════ */
function selDay(d){st.day=d;R();}
function swV(v){st.view=v;R();}
function onFab(){st.view==='week'?newTask():addMat(1);}

/* ══ SHEET ═══════════════════════════════════════════════════════════════════ */
function openSheet(html){
  document.getElementById('sh-in').innerHTML=html;
  document.getElementById('ovl').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('ovl').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

/* ══ TASK CRUD ═══════════════════════════════════════════════════════════════ */
let ET=null;
function newTask(){
  ET={id:null,t:'',d:st.day,s:'09:00',e:'10:00',c:'cabinet',r:null,rv:true,mid:null,_q:0};shTask();
}
function editTask(id){
  const t=st.tasks.find(x=>x.id===id);if(!t)return;
  const lm=t.mid?st.matrix.find(m=>m.id===t.mid):null;
  ET={...t,rv:t.rv!==false,_q:lm?lm.q:0};shTask();
}
function shTask(){
  const T=ET;
  openSheet(`
  <div class="sh-row"><span class="sh-tit">${T.id?'Modifier':'Nouvelle tâche'}</span>
    <button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <div class="fg"><label class="fl">Titre</label>
      <input class="fi" id="et-t" value="${esc(T.t)}" placeholder="Nom de la tâche" oninput="ET.t=this.value" maxlength="80" autocomplete="off"></div>
    <div class="fg"><label class="fl">Jour</label>
      <div class="day-g">${DS.map((d,i)=>`<div class="day-btn${T.d===i?' on':''}" onclick="setTd(${i})">${d}</div>`).join('')}</div></div>
    <div class="fg"><label class="fl">Horaires</label>
      <div class="row2">
        <div><div class="sub-lbl">Début</div><input type="time" class="fi" value="${T.s}" onchange="ET.s=this.value"></div>
        <div><div class="sub-lbl">Fin</div><input type="time" class="fi" value="${T.e}" onchange="ET.e=this.value"></div>
      </div></div>
    <div class="fg"><label class="fl">Catégorie</label>
      <div class="cat-g">${Object.entries(CATS).map(([k,v])=>`<div class="cat-btn${T.c===k?' on':''}" style="color:${v.c};${T.c===k?'background:'+v.bg+';border-color:'+v.c:''}" onclick="setTc('${k}')">${v.l}</div>`).join('')}</div></div>
    <div class="fg"><label class="fl">Rappel avant le début</label>
      <div class="rem-row">
        <div class="rem-btn${!T.r?' on':''}" onclick="setTr(null)">Aucun</div>
        ${[5,10,15,30,60].map(r=>`<div class="rem-btn${T.r===r?' on':''}" onclick="setTr(${r})">−${r}min</div>`).join('')}
      </div>
      ${T.r?`<div class="vib-row" style="margin-top:10px">
        <div class="vib-btn${T.rv!==false?' on':''}" onclick="ET.rv=true;shTask()">📳 Vibration</div>
        <div class="vib-btn${T.rv===false?' on':''}" onclick="ET.rv=false;shTask()">🔕 Silencieux</div>
      </div>`:''}
    </div>
    <div class="fg"><label class="fl">Ajouter à Eisenhower</label>
      <div class="q-g">
        <div class="q-btn${T._q===0?' on':''}" style="${T._q===0?'border-color:var(--acc);background:rgba(74,108,247,.15)':''}" onclick="setTq(0)">
          <div class="ql" style="color:var(--t2)">Aucun</div></div>
        ${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T._q===q?' on':''}" style="${T._q===q?'border-color:'+qd.c+';background:'+qd.bg:''}" onclick="setTq(${q})">
          <div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div>
          <div class="qs" style="color:${qd.c}">${qd.s}</div>
        </div>`;}).join('')}
      </div></div>
    <button class="btn-p" onclick="saveTask()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delTask('${T.id}')">Supprimer</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{const el=document.getElementById('et-t');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}
function setTd(d){ET.d=d;shTask();}
function setTc(c){ET.c=c;shTask();}
function setTr(r){ET.r=r;shTask();}
function setTq(q){ET._q=q;shTask();}
function saveTask(){
  const T=ET;const el=document.getElementById('et-t');if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre requis','Donne un nom à la tâche.');return;}
  const nq=T._q||0,lm=T.mid?st.matrix.find(m=>m.id===T.mid):null;
  if(nq>0){if(lm){lm.q=nq;lm.t=T.t;}else{const nid=uid();st.matrix.push({id:nid,t:T.t,q:nq,cid:T.id,rem:null});T.mid=nid;}}
  else if(nq===0&&T.mid){st.matrix=st.matrix.filter(m=>m.id!==T.mid);T.mid=null;}
  const{_q,...td}=T;
  if(td.id){const i=st.tasks.findIndex(x=>x.id===td.id);if(i>=0)st.tasks[i]={...td};}
  else{td.id=uid();if(td.mid){const mt=st.matrix.find(m=>m.id===td.mid);if(mt)mt.cid=td.id;}st.tasks.push(td);}
  save();schedAll();closeSheet();R();
}
function delTask(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const t=st.tasks.find(x=>x.id===id);
  if(t?.mid)st.matrix=st.matrix.filter(m=>m.id!==t.mid);
  st.tasks=st.tasks.filter(x=>x.id!==id);
  save();schedAll();closeSheet();R();
}

/* ══ MATRIX CRUD ═════════════════════════════════════════════════════════════ */
let EM=null;
function addMat(q){EM={id:null,t:'',q,cid:null,rem:null};shMat();}
function editMatrix(id){const t=st.matrix.find(x=>x.id===id);if(!t)return;EM={...t,rem:t.rem?JSON.parse(JSON.stringify(t.rem)):null};shMat();}
function shMat(){
  const T=EM,rem=T.rem||{mode:'recurring',time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};
  const hasRem=!!T.rem;const mode=rem.mode||'recurring';
  const cal=T.cid?st.tasks.find(x=>x.id===T.cid):null;
  openSheet(`
  <div class="sh-row"><span class="sh-tit">${T.id?'Modifier':'Nouvelle tâche'}</span>
    <button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <div class="fg"><label class="fl">Titre</label>
      <input class="fi" id="em-t" value="${esc(T.t)}" placeholder="Nom de la tâche" oninput="EM.t=this.value" maxlength="80" autocomplete="off"></div>
    <div class="fg"><label class="fl">Quadrant</label>
      <div class="q-g">${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T.q===q?' on':''}" style="${T.q===q?'border-color:'+qd.c+';background:'+qd.bg:''}" onclick="setMq(${q})">
        <div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div>
        <div class="qs" style="color:${qd.c}">${qd.l}</div>
      </div>`;}).join('')}</div></div>
    <div class="fg"><label class="fl">Rappel</label>
      <div class="rem-panel">
        <div class="tog-row">
          <span class="tog-lbl">Activer un rappel</span>
          <button class="tog${hasRem?' on':''}" id="rem-tog" onclick="togMatRem()"></button>
        </div>
        <div id="rem-opts" style="display:${hasRem?'block':'none'}">
          <div class="mode-tabs" style="margin-top:4px">
            <button class="mode-tab${mode==='unique'?' on':''}" onclick="setMatMode('unique')">🗓 Unique</button>
            <button class="mode-tab${mode==='recurring'?' on':''}" onclick="setMatMode('recurring')">🔁 Récurrent</button>
          </div>
          <div id="mode-unique" style="display:${mode==='unique'?'block':'none'}">
            <div class="row2">
              <div><div class="sub-lbl">Date</div><input type="date" class="fi" id="rem-date" value="${rem.date||''}" onchange="setMatDate(this.value)"></div>
              <div><div class="sub-lbl">Heure</div><input type="time" class="fi" id="rem-time-u" value="${rem.time||'09:00'}" onchange="setMatTime(this.value)"></div>
            </div>
          </div>
          <div id="mode-rec" style="display:${mode==='recurring'?'block':'none'}">
            <div class="sub-lbl" style="margin-bottom:8px">Jours</div>
            <div class="days-g" style="margin-bottom:12px">
              ${DS.map((d,i)=>`<div class="days-btn${(rem.days||[]).includes(i)?' on':''}" onclick="togMatDay(${i})">${d.slice(0,2)}</div>`).join('')}
            </div>
            <div class="sub-lbl" style="margin-bottom:6px">Heure</div>
            <input type="time" class="fi" id="rem-time-r" value="${rem.time||'09:00'}" onchange="setMatTime(this.value)">
          </div>
          <div style="margin-top:12px"><div class="sub-lbl" style="margin-bottom:7px">Son & vibration</div>
            <div class="vib-row">
              <div class="vib-btn${rem.vibrate!==false?' on':''}" onclick="setMatVib(true)">📳 Vibration</div>
              <div class="vib-btn${rem.vibrate===false?' on':''}" onclick="setMatVib(false)">🔕 Silencieux</div>
            </div></div>
        </div>
      </div></div>
    ${cal?`<div class="divl"></div><div class="info-box"><span>📅 Lié au calendrier : <strong>${esc(cal.t)}</strong></span></div>`:''}
    <button class="btn-p" onclick="saveMat()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delMat('${T.id}')">Supprimer</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{const el=document.getElementById('em-t');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}
function togMatRem(){
  const active=!!EM.rem;
  EM.rem=active?null:{mode:'recurring',time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};
  shMat();
}
function setMatMode(m){
  if(!EM.rem)EM.rem={mode:m,time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};
  else EM.rem.mode=m;
  shMat();
}
function setMatDate(v){if(EM.rem)EM.rem.date=v;}
function setMatTime(v){if(EM.rem)EM.rem.time=v;}
function setMatVib(v){if(EM.rem){EM.rem.vibrate=v;shMat();}}
function togMatDay(i){
  if(!EM.rem)return;
  const days=EM.rem.days||[];
  const idx=days.indexOf(i);
  if(idx>=0)days.splice(idx,1);else days.push(i);
  EM.rem.days=days;
  document.querySelectorAll('.days-btn').forEach((b,j)=>b.classList.toggle('on',days.includes(j)));
}
function setMq(q){EM.q=q;shMat();}
function saveMat(){
  const T=EM;const el=document.getElementById('em-t');if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre requis','Donne un nom à la tâche.');return;}
  // Read current time inputs
  const tu=document.getElementById('rem-time-u'),tr=document.getElementById('rem-time-r');
  if(T.rem){
    if(T.rem.mode==='unique'){const d=document.getElementById('rem-date');if(d)T.rem.date=d.value;if(tu)T.rem.time=tu.value;}
    else{if(tr)T.rem.time=tr.value;}
    if(T.rem.mode==='unique'&&!T.rem.date){toast('Date requise','Sélectionne une date pour le rappel unique.');return;}
    if(T.rem.mode==='recurring'&&(!T.rem.days||!T.rem.days.length)){T.rem=null;}
  }
  if(T.id){const i=st.matrix.findIndex(x=>x.id===T.id);if(i>=0)st.matrix[i]={...T};
    if(T.cid){const ct=st.tasks.find(x=>x.id===T.cid);if(ct)ct.t=T.t;}}
  else{T.id=uid();st.matrix.push({...T});}
  save();schedAll();closeSheet();R();
}
function delMat(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const mt=st.matrix.find(x=>x.id===id);
  if(mt?.cid){const ct=st.tasks.find(x=>x.id===mt.cid);if(ct)ct.mid=null;}
  st.matrix=st.matrix.filter(x=>x.id!==id);
  save();schedAll();closeSheet();R();
}

/* ══ NOTIF BUTTON ════════════════════════════════════════════════════════════ */
async function doNotif(){
  const ok=await askNotif();
  if(ok){schedAll();toast('🔔 Rappels activés','Tous les rappels sont programmés.');}
  else toast('Notifications désactivées','Réglages → Safari → Mon site → Notifications.');
}

/* ══ MANIFEST ════════════════════════════════════════════════════════════════ */
function setupManifest(){
  const l=document.createElement('link');l.rel='manifest';l.href='./manifest.json';
  document.head.appendChild(l);
}

/* ══ INIT ════════════════════════════════════════════════════════════════════ */
setupManifest();
load();
initSW().then(()=>{
  askNotif().then(ok=>{if(ok)schedAll();});
});
R();
</script>
