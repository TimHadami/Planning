<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="theme-color" content="#F2EFE8">
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Mon Planning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#F2EFE8;--sf:#FDFCF9;--sf2:#F7F4ED;--sf3:#EEEAE0;
  --t1:#141820;--t2:#5B6275;--t3:#9AA3B5;
  --card:#0B1728;--card2:#0E1E34;
  --ct1:#E8F0FF;--ct2:#7A90B5;--ct3:#3E5472;
  --acc:#4F6EF5;--acc2:rgba(79,110,245,.12);
  --sol:linear-gradient(135deg,#F59E0B 0%,#EF4444 38%,#EC4899 68%,#8B5CF6 100%);
  --sh-card:0 2px 4px rgba(20,24,32,.05),0 8px 20px rgba(20,24,32,.09),0 24px 48px rgba(20,24,32,.07),inset 0 1px 0 rgba(255,255,255,.07);
  --sh-float:0 4px 8px rgba(20,24,32,.06),0 16px 32px rgba(20,24,32,.10),0 32px 64px rgba(20,24,32,.06);
  --sh-sheet:0 -8px 40px rgba(20,24,32,.12);
  --r:22px;--r2:16px;--r3:12px;--rpill:40px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
html,body{height:100%;overflow:hidden;
  background:radial-gradient(ellipse at 15% 15%,rgba(245,228,186,.55) 0%,transparent 55%),
             radial-gradient(ellipse at 85% 80%,rgba(210,225,255,.4) 0%,transparent 55%),var(--bg);
  color:var(--t1);font-family:'Inter',-apple-system,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st);overflow:hidden}

/* HEADER */
.hdr{padding:16px 20px 4px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between}
.hdr-l .h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.2px;color:var(--t1);line-height:1.15}
.hdr-l .h2{font-size:11px;color:var(--t3);margin-top:4px;font-weight:500;letter-spacing:.8px;text-transform:uppercase}
.hdr-r{display:flex;gap:7px;align-items:center;margin-top:2px}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:var(--sf);border:1px solid rgba(20,24,32,.1);color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,24,32,.07)}
.hdivider{height:1px;margin:4px 20px 0;background:linear-gradient(90deg,transparent,rgba(20,24,32,.08) 20%,rgba(20,24,32,.08) 80%,transparent)}

/* WEEK NAVIGATOR */
.wk-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 2px;flex-shrink:0}
.wk-arrow{width:34px;height:34px;border-radius:50%;background:var(--sf);border:1px solid rgba(20,24,32,.09);color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(20,24,32,.06);transition:.15s;font-family:inherit}
.wk-arrow:active{background:var(--sf3)}
.wk-info{text-align:center}
.wk-label{font-size:13px;font-weight:700;color:var(--t1)}
.wk-sub{font-size:10px;color:var(--t3);margin-top:1px;text-transform:uppercase;letter-spacing:.6px}
.wk-score{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}

/* DAY PILLS */
.ds-wrap{display:flex;gap:7px;padding:8px 20px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ds-wrap::-webkit-scrollbar{display:none}
.dp{min-width:46px;height:64px;border-radius:14px;background:var(--sf);border:1px solid rgba(20,24,32,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;flex-shrink:0;transition:.18s;box-shadow:0 2px 6px rgba(20,24,32,.06);position:relative}
.dp .dn{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.dp .dd{font-size:17px;font-weight:700;color:var(--t2);margin-top:1px}
.dp .dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:2px}
.dp.has-t .dot{background:var(--acc)}
.dp.today{border:1.5px solid transparent;background-clip:padding-box;position:relative}
.dp.today::before{content:'';position:absolute;inset:-1.5px;border-radius:15.5px;background:var(--sol);z-index:-1;opacity:.65}
.dp.today .dn,.dp.today .dd{color:var(--t1)}
.dp.active{background:var(--card);border-color:transparent;box-shadow:var(--sh-float);position:relative}
.dp.active::before{content:'';position:absolute;inset:-1.5px;border-radius:15.5px;background:var(--sol);z-index:-1}
.dp.active .dn,.dp.active .dd{color:#fff}
.dp.active .dot{background:rgba(255,255,255,.7)}
.dp-score{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:0 16px 110px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* TASK CARDS */
.tlist{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tc-wrap{position:relative;border-radius:calc(var(--r) + 2px);padding:2px;box-shadow:var(--sh-float);transition:.15s}
.tc-wrap[data-cat=cabinet]{background:linear-gradient(145deg,#38BDF8,#818CF8,#38BDF8)}
.tc-wrap[data-cat=perso]{background:linear-gradient(145deg,#34D399,#A3E635,#34D399)}
.tc-wrap[data-cat=ia]{background:linear-gradient(145deg,#A78BFA,#60A5FA,#F472B6)}
.tc-wrap[data-cat=sport]{background:linear-gradient(145deg,#FCD34D,#F97316,#FCD34D)}
.tc-wrap[data-cat=routine]{background:linear-gradient(145deg,#94A3B8,#CBD5E1,#94A3B8)}
.tc-wrap[data-cat=lecture]{background:linear-gradient(145deg,#FB923C,#FBBF24,#FB923C)}
.tc-wrap[data-cat=social]{background:linear-gradient(145deg,#F472B6,#E879F9,#FB7185)}
.tc-wrap.done-task{opacity:.62}
.tc{background:linear-gradient(170deg,var(--card2) 0%,var(--card) 60%,#091220 100%);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.14s;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px}
.tc:active{transform:scale(.977)}
.tc::after{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent)}
.tc-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--ct3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;cursor:pointer;margin-top:1px}
.tc-check.done{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent}
.tc-check svg{display:none}
.tc-check.done svg{display:block}
.tc-body{flex:1;min-width:0}
.tc-t{font-size:15px;font-weight:600;color:var(--ct1);margin-bottom:3px;line-height:1.3}
.tc-time{font-size:12px;color:var(--ct2);font-weight:500;letter-spacing:.2px}
.tc-meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 11px;border-radius:var(--rpill);text-transform:uppercase;letter-spacing:.4px;color:var(--ct1)}
.rbadge{font-size:11px;color:var(--ct2);font-weight:500}
.mbadge{font-size:11px;font-weight:600}
.tip-btn{font-size:14px;cursor:pointer;flex-shrink:0;margin-top:2px;opacity:.7}

/* DAY SCORE BAR */
.day-footer{margin-top:16px;background:var(--sf);border-radius:var(--r2);padding:14px 16px;border:1px solid rgba(20,24,32,.08);box-shadow:0 2px 8px rgba(20,24,32,.05)}
.df-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.df-label{font-size:13px;font-weight:600;color:var(--t1)}
.df-stats{font-size:12px;color:var(--t2)}
.score-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.score-row::-webkit-scrollbar{display:none}
.score-pill{width:32px;height:32px;border-radius:50%;border:2px solid rgba(20,24,32,.12);background:var(--sf2);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;transition:.14s;font-family:'Inter',sans-serif}
.score-pill.active{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.2)}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 16px}
.empty-icon{font-size:44px;margin-bottom:14px;line-height:1}
.empty-t{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;color:var(--t1);margin-bottom:8px}
.empty-s{font-size:14px;color:var(--t2);line-height:1.65}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(253,252,249,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(20,24,32,.09);padding-bottom:var(--sb);z-index:90}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:11px 0;cursor:pointer;color:var(--t3);gap:3px;border:none;background:none;font-family:'Inter',sans-serif;transition:.18s;position:relative}
.ni.active{color:var(--acc)}
.ni.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--sol)}
.ni-ico{font-size:20px;line-height:1}
.ni-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* FAB */
.fab{position:fixed;right:22px;width:56px;height:56px;border-radius:50%;background:var(--sol);border:none;color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:91;box-shadow:0 6px 20px rgba(239,68,68,.35),0 12px 40px rgba(139,92,246,.2);transition:.15s;font-weight:300}
.fab:active{transform:scale(.88)}

/* OVERLAY + SHEET */
.ovl{position:fixed;inset:0;background:rgba(14,19,32,.45);z-index:200;opacity:0;pointer-events:none;transition:.22s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ovl.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-radius:26px 26px 0 0;z-index:201;transform:translateY(102%);transition:.34s cubic-bezier(.32,0,.16,1);max-height:94vh;overflow-y:auto;padding-bottom:calc(var(--sb)+14px);scrollbar-width:none;box-shadow:var(--sh-sheet)}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.sh-accent{height:4px;background:var(--sol);border-radius:4px 4px 0 0}
.sh-hdl{width:38px;height:4px;border-radius:2px;background:var(--sf3);margin:12px auto 0;display:block}
.sh-row{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 4px}
.sh-tit{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;color:var(--t1)}
.sh-x{width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid rgba(20,24,32,.1);color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sh-body{padding:6px 22px 12px}

/* FORM */
.fg{margin-bottom:16px}
.fl{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.9px}
.fi{width:100%;background:var(--sf2);border:1.5px solid rgba(20,24,32,.1);border-radius:14px;padding:13px 16px;font-size:16px;color:var(--t1);outline:none;-webkit-appearance:none;font-family:'Inter',sans-serif;-webkit-user-select:auto;user-select:auto;transition:.2s;caret-color:var(--acc)}
.fi:focus{border-color:var(--acc);background:var(--sf);box-shadow:0 0 0 3px rgba(79,110,245,.12)}
.fi::placeholder{color:var(--t3)}
input[type=time].fi,input[type=date].fi{color-scheme:light}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-lbl{font-size:10px;color:var(--t3);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.day-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day-btn{padding:10px 4px;border-radius:12px;border:1.5px solid rgba(20,24,32,.1);background:var(--sf2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:var(--t2);font-family:'Inter',sans-serif;transition:.14s}
.day-btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.cat-g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-btn{padding:9px 4px;border-radius:11px;border:2px solid transparent;background:var(--sf2);font-size:10px;font-weight:700;cursor:pointer;text-align:center;transition:.14s;text-transform:uppercase;letter-spacing:.3px;line-height:1.3;font-family:'Inter',sans-serif;color:var(--t2)}
.cat-btn.on{border-color:currentColor;background:var(--sf)}
.rem-row{display:flex;gap:8px;flex-wrap:wrap}
.rem-btn{padding:9px 14px;border-radius:var(--rpill);border:1.5px solid rgba(20,24,32,.1);background:var(--sf2);font-size:13px;color:var(--t2);cursor:pointer;font-family:'Inter',sans-serif;transition:.14s;font-weight:500}
.rem-btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.q-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-btn{padding:11px 8px;border-radius:14px;border:2px solid rgba(20,24,32,.09);cursor:pointer;text-align:center;background:var(--sf2);font-family:'Inter',sans-serif;transition:.14s}
.q-btn .ql{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.q-btn .qs{font-size:10px;margin-top:3px;opacity:.7}
.days-g{display:flex;gap:6px;flex-wrap:wrap}
.days-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(20,24,32,.1);background:var(--sf2);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;color:var(--t2);display:flex;align-items:center;justify-content:center;transition:.14s}
.days-btn.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.tog-lbl{font-size:14px;font-weight:500;color:var(--t1)}
.tog{width:50px;height:28px;border-radius:14px;background:var(--sf3);border:none;cursor:pointer;position:relative;transition:.22s;flex-shrink:0}
.tog.on{background:var(--acc)}
.tog::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.22s;box-shadow:0 2px 6px rgba(20,24,32,.2)}
.tog.on::after{left:25px}
.mode-tabs{display:flex;gap:0;background:var(--sf2);border-radius:12px;padding:3px;margin-bottom:14px;border:1px solid rgba(20,24,32,.09)}
.mode-tab{flex:1;padding:9px;border-radius:10px;border:none;background:transparent;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s}
.mode-tab.on{background:#fff;color:var(--t1);box-shadow:0 2px 8px rgba(20,24,32,.1)}
.vib-row{display:flex;gap:8px}
.vib-btn{flex:1;padding:11px;border-radius:12px;border:1.5px solid rgba(20,24,32,.1);background:var(--sf2);font-size:13px;color:var(--t2);cursor:pointer;font-family:'Inter',sans-serif;text-align:center;font-weight:600;transition:.14s}
.vib-btn.on{background:var(--sf);border-color:var(--acc);color:var(--acc);box-shadow:0 2px 8px rgba(79,110,245,.12)}
.rem-panel{background:var(--sf2);border:1px solid rgba(20,24,32,.09);border-radius:18px;padding:16px}
.btn-p{width:100%;padding:16px;border-radius:var(--r2);background:var(--sol);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif;box-shadow:0 6px 22px rgba(239,68,68,.3),0 2px 6px rgba(20,24,32,.1);transition:.15s}
.btn-p:active{opacity:.82;transform:scale(.98)}
.btn-d{width:100%;padding:14px;border-radius:var(--r2);background:rgba(239,68,68,.07);color:#DC2626;font-size:15px;font-weight:700;border:1px solid rgba(239,68,68,.2);cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif}
.btn-s{width:100%;padding:14px;border-radius:var(--r2);background:var(--sf2);color:var(--t2);font-size:15px;font-weight:600;border:1.5px solid rgba(20,24,32,.1);cursor:pointer;margin-top:10px;font-family:'Inter',sans-serif}
.divl{height:1px;background:rgba(20,24,32,.07);margin:16px 0}
.info-box{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf2);border-radius:14px;border:1px solid rgba(20,24,32,.09)}
.info-box span{font-size:13px;color:var(--t2);flex:1;line-height:1.5}

/* WEEKLY GRID VIEW */
.wkgrid-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
.wkgrid-head{display:flex;flex-shrink:0;padding:0 16px;gap:6px}
.wkgd-hcell{flex:1;min-width:0;text-align:center;padding:8px 2px;position:relative}
.wkgd-hd{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.wkgd-hdate{font-size:15px;font-weight:700;color:var(--t2)}
.wkgd-hdate.today{color:var(--acc)}
.wkgd-hdate.active-day{background:var(--card);color:#fff;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.wkgrid-body{flex:1;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 16px 110px;scrollbar-width:none}
.wkgrid-body::-webkit-scrollbar{display:none}
.wkgrid{display:flex;gap:6px;min-width:100%;align-items:flex-start}
.wkgd-col{flex:1;min-width:80px;display:flex;flex-direction:column;gap:5px}
.wkgd-task{border-radius:10px;padding:6px 7px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.wkgd-task.done-t{opacity:.55}
.wkgd-task::before{content:'';position:absolute;inset:0;opacity:.12;pointer-events:none}
.wkgd-task-t{font-size:10px;font-weight:600;color:#fff;line-height:1.3;word-break:break-word}
.wkgd-task-time{font-size:9px;color:rgba(255,255,255,.65);margin-top:2px}
.wkgd-check{font-size:11px;position:absolute;top:4px;right:4px}
.wkgd-score{margin-top:6px;text-align:center}
.wkgd-score-pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
.wkgd-add{border-radius:10px;padding:6px 7px;border:1.5px dashed rgba(20,24,32,.18);font-size:10px;color:var(--t3);cursor:pointer;text-align:center;background:transparent}

/* EISENHOWER */
.mat-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:110px}
.mat-wrap::-webkit-scrollbar{display:none}
.mat-g{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:6px 16px}
.quad-wrap{position:relative;border-radius:calc(var(--r) + 2px);padding:2px;box-shadow:var(--sh-float)}
.quad-wrap[data-q="1"]{background:linear-gradient(145deg,#F87171,#FCA5A5,#F87171)}
.quad-wrap[data-q="2"]{background:linear-gradient(145deg,#34D399,#6EE7B7,#34D399)}
.quad-wrap[data-q="3"]{background:linear-gradient(145deg,#FCD34D,#FDE68A,#FCD34D)}
.quad-wrap[data-q="4"]{background:linear-gradient(145deg,#94A3B8,#CBD5E1,#94A3B8)}
.quad{background:linear-gradient(160deg,var(--card2) 0%,var(--card) 100%);border-radius:var(--r);padding:14px 13px;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative;overflow:hidden}
.quad::after{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.q-hd{margin-bottom:2px}
.q-nm{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.q-lbl{font-family:'Playfair Display',Georgia,serif;font-size:13px;font-weight:700;margin-top:3px;line-height:1.25;color:var(--ct1)}
.q-hint{font-size:10px;color:var(--ct2);margin-top:2px}
.qt{background:rgba(255,255,255,.07);border-radius:11px;padding:9px 11px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:5px;transition:.14s;line-height:1.35;border:1px solid rgba(255,255,255,.08)}
.qt:active{transform:scale(.95)}

/* Week key: "YYYY-Www" */
function weekKey(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);
  const y1=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  const wn=Math.ceil((((dt-y1)/86400000)+1)/7);
  return`${dt.getUTCFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function wkKeyToMon(wk){
  const[yr,wn]=wk.split('-W').map(Number);
  const jan4=new Date(yr,0,4);
  const dow=(jan4.getDay()||7);
  const mon=new Date(jan4);mon.setDate(jan4.getDate()-dow+1+(wn-1)*7);
  return mon;
}
function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function todayKey(){return formatDate(new Date());}

    insts[wk]=st.tasks;ss(KI,insts);
  }
  const allDone=gs(KD)||{};st.done=allDone[wk]||{};
  st.matrix=gs(KM)||[];
  st.diagDeleted=gs(KDG)||[];
}
function saveWeek(){
  const insts=gs(KI)||{};insts[st.weekKey]=st.tasks;ss(KI,insts);
  const allDone=gs(KD)||{};allDone[st.weekKey]=st.done;ss(KD,allDone);
  ss(KM,st.matrix);
}
function navWeek(delta){
  const mon=wkKeyToMon(st.weekKey);
  mon.setDate(mon.getDate()+delta*7);
  const nk=weekKey(mon);
  const today=weekKey(new Date());
  const maxYear=new Date().getFullYear()+50;
  if(mon.getFullYear()>maxYear)return;
  if(nk===weekKey(new Date(new Date().getFullYear()-2,0,1)))return;
  loadWeek(nk);R();
}
function wkMon(){return wkKeyToMon(st.weekKey);}
function wkDates(){const m=wkMon();return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}
function wkLabel(){
  const ds=wkDates();const a=ds[0],b=ds[6];
  const sm=a.getMonth()===b.getMonth()?`${a.getDate()} — ${b.getDate()} ${MN[b.getMonth()]} ${b.getFullYear()}`:`${a.getDate()} ${MN[a.getMonth()]} — ${b.getDate()} ${MN[b.getMonth()]} ${b.getFullYear()}`;
  return sm;
}
function wkNum(){return st.weekKey.split('-W')[1];}

/* ══ SCORES ══ */
function scoreColor(s){
  const colors=['#EF4444','#F87171','#FB923C','#FBBF24','#FACC15','#A3E635','#86EFAC','#34D399','#10B981','#059669','#047857'];
  return colors[Math.max(0,Math.min(10,Math.round(s)))];
}
function getScore(dateStr){const s=gs(KS)||{};return s[dateStr];}
function setScore(dateStr,val){const s=gs(KS)||{};s[dateStr]=val;ss(KS,s);R();}
function getWeekAvg(wk){
  const mon=wkKeyToMon(wk);const sc=gs(KS)||{};const vals=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const v=sc[formatDate(d)];if(v!=null)vals.push(v);}
  return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
}
function getMonthAvg(year,month){
  const sc=gs(KS)||{};const vals=[];
  const days=new Date(year,month+1,0).getDate();
  for(let d=1;d<=days;d++){const k=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const v=sc[k];if(v!=null)vals.push(v);}
  return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
}
function getYearAvg(year){
  const sc=gs(KS)||{};const vals=Object.entries(sc).filter(([k])=>k.startsWith(String(year))).map(([,v])=>v);
  return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
}

/* ══ NOTIFICATIONS ══ */
let swReg=null;
async function initSW(){if(!('serviceWorker' in navigator))return;try{swReg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});}catch(e){}}
async function askNotif(){if(!('Notification' in window))return false;if(Notification.permission==='default')await Notification.requestPermission();return Notification.permission==='granted';}
function sendSW(data){const ctrl=navigator.serviceWorker&&navigator.serviceWorker.controller;if(ctrl)ctrl.postMessage(data);else if(swReg&&swReg.active)swReg.active.postMessage(data);}
let _tt=null;
function toast(ttl,bdy,ms=4500){const el=document.getElementById('toast');document.getElementById('t-ttl').textContent=ttl;document.getElementById('t-bdy').textContent=bdy;el.classList.add('show');if(_tt)clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),ms);}
function nextFireAt(dow,timeStr,minsBefore){const now=new Date(),today=(now.getDay()+6)%7;let diff=(dow-today+7)%7;if(diff===0){const[h,m]=timeStr.split(':').map(Number);const tMs=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m).getTime()-minsBefore*60000;if(tMs<=Date.now())diff=7;}const tgt=new Date(now);tgt.setDate(now.getDate()+diff);const[h,m]=timeStr.split(':').map(Number);tgt.setHours(h,m,0,0);return tgt.getTime()-minsBefore*60000;}
function schedAll(){
  const rems=[];
  st.tasks.forEach(tk=>{
    if(!tk.r)return;
    const fireAt=nextFireAt(tk.d,tk.s,tk.r);
    rems.push({id:'tk_'+tk.id,title:tk.t,body:`Commence dans ${tk.r} min — ${(CATS[tk.c]||CATS.routine).l}`,fireAt,vibrate:tk.rv!==false});
    const delay=fireAt-Date.now();if(delay>0&&delay<25*3600*1000)setTimeout(()=>toast('⏰ '+tk.t,`Commence dans ${tk.r} min`),delay);
  });
  st.matrix.forEach(mk=>{
    if(!mk.rem)return;const rem=mk.rem;
    if(rem.mode==='unique'&&rem.date&&rem.time){const[y,mo,d]=rem.date.split('-').map(Number);const[h,mi]=rem.time.split(':').map(Number);const fireAt=new Date(y,mo-1,d,h,mi).getTime();if(fireAt>Date.now())rems.push({id:'mk_'+mk.id,title:mk.t,body:'Rappel Eisenhower',fireAt,vibrate:rem.vibrate!==false});}
    else if(rem.mode==='recurring'&&rem.days&&rem.days.length&&rem.time){rem.days.forEach((day,i)=>{const fireAt=nextFireAt(day,rem.time,0);if(fireAt>Date.now())rems.push({id:'mk_'+mk.id+'_'+i,title:mk.t,body:'Rappel Eisenhower récurrent',fireAt,vibrate:rem.vibrate!==false});});}
  });
  sendSW({type:'RESCHEDULE_ALL',reminders:rems});
}
async function doNotif(){const ok=await askNotif();if(ok){schedAll();toast('🔔 Rappels activés','Tous les rappels sont programmés.');}else toast('Notifications désactivées','Réglages → Safari → Notifications du site.');}

        <div><div class="sub-lbl">Fin</div><input type="time" class="fi" value="${T.e}" onchange="ET.e=this.value"></div>
      </div></div>
    <div class="fg"><label class="fl">Catégorie</label>
      <div class="cat-g">${Object.entries(CATS).map(([k,v])=>`<div class="cat-btn${T.c===k?' on':''}" style="color:${v.c};${T.c===k?'border-color:'+v.c+';':''}" onclick="setTc('${k}')">${v.l}</div>`).join('')}</div></div>
    <div class="fg"><label class="fl">Rappel</label>
      <div class="rem-row">
        <div class="rem-btn${!T.r?' on':''}" onclick="setTr(null)">Aucun</div>
        ${[5,10,15,30,60].map(r=>`<div class="rem-btn${T.r===r?' on':''}" onclick="setTr(${r})">−${r}min</div>`).join('')}
      </div>
      ${T.r?`<div class="vib-row" style="margin-top:10px">
        <div class="vib-btn${T.rv!==false?' on':''}" onclick="ET.rv=true;shTask()">📳 Vibration</div>
        <div class="vib-btn${T.rv===false?' on':''}" onclick="ET.rv=false;shTask()">🔕 Silencieux</div>
      </div>`:''}</div>
    <div class="fg"><label class="fl">Eisenhower</label>
      <div class="q-g">
        <div class="q-btn${T._q===0?' on':''}" style="${T._q===0?'border-color:var(--acc);background:var(--acc2)':''}" onclick="setTq(0)"><div class="ql" style="color:var(--t2)">Aucun</div></div>
        ${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T._q===q?' on':''}" style="${T._q===q?'border-color:'+qd.c+';background:'+qd.c+'12':''}" onclick="setTq(${q})"><div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div><div class="qs" style="color:${qd.c}">${qd.s}</div></div>`;}).join('')}
      </div></div>
    <button class="btn-p" onclick="saveTask()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delTask('${T.id}')">Supprimer la tâche</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{const el=document.getElementById('et-t');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}
function setTd(d){ET.d=d;shTask();}function setTc(c){ET.c=c;shTask();}function setTr(r){ET.r=r;shTask();}function setTq(q){ET._q=q;shTask();}
function saveTask(){
  const T=ET;const el=document.getElementById('et-t');if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre requis','Donne un nom à la tâche.');return;}
  const nq=T._q||0,lm=T.mid?st.matrix.find(m=>m.id===T.mid):null;
  if(nq>0){if(lm){lm.q=nq;lm.t=T.t;}else{const nid=uid();st.matrix.push({id:nid,t:T.t,q:nq,cid:T.id,rem:null});T.mid=nid;}}
  else if(nq===0&&T.mid){st.matrix=st.matrix.filter(m=>m.id!==T.mid);T.mid=null;}
  const{_q,...td}=T;
  if(td.id){const i=st.tasks.findIndex(x=>x.id===td.id);if(i>=0)st.tasks[i]={...td};}
  else{td.id=uid();if(td.mid){const mt=st.matrix.find(m=>m.id===td.mid);if(mt)mt.cid=td.id;}st.tasks.push(td);}
  saveWeek();schedAll();closeSheet();R();
}
function delTask(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const t=st.tasks.find(x=>x.id===id);if(t?.mid)st.matrix=st.matrix.filter(m=>m.id!==t.mid);
  st.tasks=st.tasks.filter(x=>x.id!==id);saveWeek();schedAll();closeSheet();R();
}

/* ══ MATRIX CRUD ══ */
let EM=null;
function addMat(q){EM={id:null,t:'',q,cid:null,rem:null};shMat();}
function editMatrix(id){const t=st.matrix.find(x=>x.id===id);if(!t)return;EM={...t,rem:t.rem?JSON.parse(JSON.stringify(t.rem)):null};shMat();}
function shMat(){
  const T=EM,rem=T.rem||{mode:'recurring',time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};
  const hasRem=!!T.rem,mode=rem.mode||'recurring';
  const cal=T.cid?st.tasks.find(x=>x.id===T.cid):null;
  openSheet(`
  <div class="sh-row"><span class="sh-tit">${T.id?'Modifier':'Nouvelle tâche'}</span>
    <button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body">
    <div class="fg"><label class="fl">Titre</label>
      <input class="fi" id="em-t" value="${esc(T.t)}" placeholder="Nom de la tâche" oninput="EM.t=this.value" maxlength="80" autocomplete="off"></div>
    <div class="fg"><label class="fl">Quadrant</label>
      <div class="q-g">${[1,2,3,4].map(q=>{const qd=QD[q];return`<div class="q-btn${T.q===q?' on':''}" style="${T.q===q?'border-color:'+qd.c+';background:'+qd.c+'12':''}" onclick="setMq(${q})"><div class="ql" style="color:${qd.c}">${qd.e} Q${q}</div><div class="qs" style="color:${qd.c}">${qd.l}</div></div>`;}).join('')}</div></div>
    <div class="fg"><label class="fl">Rappel</label>
      <div class="rem-panel">
        <div class="tog-row"><span class="tog-lbl">Activer un rappel</span>
          <button class="tog${hasRem?' on':''}" onclick="togMR()"></button></div>
        <div id="rem-opts" style="display:${hasRem?'block':'none'}">
          <div class="mode-tabs">
            <button class="mode-tab${mode==='unique'?' on':''}" onclick="setMMode('unique')">🗓 Unique</button>
            <button class="mode-tab${mode==='recurring'?' on':''}" onclick="setMMode('recurring')">🔁 Récurrent</button>
          </div>
          <div id="mu" style="display:${mode==='unique'?'block':'none'}">
            <div class="row2">
              <div><div class="sub-lbl">Date</div><input type="date" class="fi" id="rd" value="${rem.date||''}" onchange="setMDate(this.value)"></div>
              <div><div class="sub-lbl">Heure</div><input type="time" class="fi" id="rtu" value="${rem.time||'09:00'}" onchange="setMTime(this.value)"></div>
            </div>
          </div>
          <div id="mr" style="display:${mode==='recurring'?'block':'none'}">
            <div class="sub-lbl" style="margin-bottom:8px">Jours</div>
            <div class="days-g" style="margin-bottom:12px">
              ${DS.map((d,i)=>`<div class="days-btn${(rem.days||[]).includes(i)?' on':''}" onclick="togMDay(${i})">${d.slice(0,2)}</div>`).join('')}
            </div>
            <div class="sub-lbl" style="margin-bottom:6px">Heure</div>
            <input type="time" class="fi" id="rtr" value="${rem.time||'09:00'}" onchange="setMTime(this.value)">
          </div>
          <div style="margin-top:12px"><div class="sub-lbl" style="margin-bottom:7px">Son & vibration</div>
            <div class="vib-row">
              <div class="vib-btn${rem.vibrate!==false?' on':''}" onclick="setMVib(true)">📳 Vibration</div>
              <div class="vib-btn${rem.vibrate===false?' on':''}" onclick="setMVib(false)">🔕 Silencieux</div>
            </div></div>
        </div>
      </div></div>
    ${cal?`<div class="divl"></div><div class="info-box"><span>📅 Lié : <strong>${esc(cal.t)}</strong></span></div>`:''}
    <button class="btn-p" onclick="saveMat()">Enregistrer</button>
    ${T.id?`<button class="btn-d" onclick="delMat('${T.id}')">Supprimer</button>`:''}
    <button class="btn-s" onclick="closeSheet()">Annuler</button>
  </div>`);
  setTimeout(()=>{const el=document.getElementById('em-t');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},350);
}
function togMR(){const a=!!EM.rem;EM.rem=a?null:{mode:'recurring',time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};shMat();}
function setMMode(m){if(!EM.rem)EM.rem={mode:m,time:'09:00',days:[0,1,2,3,4],date:'',vibrate:true};else EM.rem.mode=m;shMat();}
function setMDate(v){if(EM.rem)EM.rem.date=v;}function setMTime(v){if(EM.rem)EM.rem.time=v;}
function setMVib(v){if(EM.rem){EM.rem.vibrate=v;shMat();}}
function togMDay(i){if(!EM.rem)return;const days=EM.rem.days||[];const idx=days.indexOf(i);if(idx>=0)days.splice(idx,1);else days.push(i);EM.rem.days=days;document.querySelectorAll('.days-btn').forEach((b,j)=>b.classList.toggle('on',days.includes(j)));}
function setMq(q){EM.q=q;shMat();}
function saveMat(){
  const T=EM;const el=document.getElementById('em-t');if(el)T.t=el.value.trim();
  if(!T.t){toast('Titre requis','Donne un nom.');return;}
  const rtu=document.getElementById('rtu'),rtr=document.getElementById('rtr'),rd=document.getElementById('rd');
  if(T.rem){if(T.rem.mode==='unique'){if(rd)T.rem.date=rd.value;if(rtu)T.rem.time=rtu.value;if(!T.rem.date){toast('Date requise','Sélectionne une date.');return;}}else{if(rtr)T.rem.time=rtr.value;if(!T.rem.days||!T.rem.days.length){T.rem=null;}}}
  if(T.id){const i=st.matrix.findIndex(x=>x.id===T.id);if(i>=0)st.matrix[i]={...T};if(T.cid){const ct=st.tasks.find(x=>x.id===T.cid);if(ct)ct.t=T.t;}}
  else{T.id=uid();st.matrix.push({...T});}
  saveWeek();schedAll();closeSheet();R();
}
function delMat(id){
  if(!confirm('Supprimer cette tâche ?'))return;
  const mt=st.matrix.find(x=>x.id===id);if(mt?.cid){const ct=st.tasks.find(x=>x.id===mt.cid);if(ct)ct.mid=null;}
  st.matrix=st.matrix.filter(x=>x.id!==id);saveWeek();schedAll();closeSheet();R();
}

/* ══ INIT ══ */
migrate();
st.weekKey=weekKey(new Date());
loadWeek(st.weekKey);
initSW().then(()=>{askNotif().then(ok=>{if(ok)setTimeout(schedAll,800);});});
R();
</script>
</body>
</html>
